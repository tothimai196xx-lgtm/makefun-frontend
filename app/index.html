<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>make.fun bounties</title>
<meta name="description" content="A fast, read-only frontend for make.fun bounties: the live board, bounty pages, leaderboards and public profiles.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#/"><strong>make.fun</strong> <span>bounties</span></a>
    <nav class="topnav" aria-label="Main">
      <a href="#/" data-nav="board">Board</a>
      <a href="https://make.fun" target="_blank" rel="noopener">make.fun ↗</a>
    </nav>
    <form class="profilesearch" id="profile-form" role="search">
      <label class="visually-hidden" for="profile-handle">Look up a profile</label>
      <input id="profile-handle" name="handle" type="search" placeholder="handle, e.g. lucdk" autocomplete="off" spellcheck="false">
      <button type="submit">Profile</button>
    </form>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<footer class="wrap foot">
  <p>Unofficial read-only frontend. Data comes live from <a href="https://make.fun/api/competitions?status=open">make.fun&rsquo;s public API</a>. No sign-in, nothing is written back.</p>
  <p>Built for the <a href="https://make.fun/bounty/makefun-frontend-01">make.fun frontend bounty</a> · <a href="https://make.fun/r/wxz47nrz">try make.fun</a></p>
</footer>
<script>window.__shotReady = false;</script>
<script type="module" src="/main.js"></script>
</body>
</html>
